<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Profile · Bluesteel Dragons</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
    <div class="nav-brand">
        <span class="nav-icon">⬡</span>
        <span>Bluesteel Dragons</span>
    </div>
    <div class="nav-links">
        <a href="index.html" class="nav-link">Scanner</a>
        <a href="students.html" class="nav-link active">Directory</a>
        <a href="admin.html" class="nav-link nav-admin">Admin ↗</a>
    </div>
</nav>

<div class="page-wrap">

    <a href="students.html" class="back-btn">← Back to Directory</a>

    <div id="profileHeader" class="profile-header">
        <button id="editStudentBtn" class="btn-edit profile-edit-btn hidden" type="button" aria-label="Edit student" title="Edit student">✎</button>
        <div class="profile-avatar" id="profileAvatar">?</div>
        <div class="profile-info">
            <h1 id="profileName">Loading…</h1>
            <p id="profileId">—</p>
            <p id="firstMeeting" class="first-meeting-label"></p>
        </div>
    </div>

    <div class="stats-grid profile-stats-grid">
        <div class="stat-card">
            <div class="stat-label">Total Hours</div>
            <div class="stat-value" id="totalHours">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Sessions</div>
            <div class="stat-value" id="totalSessions">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Missed</div>
            <div class="stat-value" id="missedMeetings" style="color:var(--red);">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Total Auto Sign Outs</div>
            <div class="stat-value" id="totalAutoSignOuts">0</div>
            <div class="stat-detail"><span id="autoSignOutHoursLost">0.00</span> hrs lost from auto sign-outs</div>
        </div>
    </div>

    <div>
        <div class="section-label">Session History</div>
        <div id="sessionList">
            <div class="empty">Loading sessions…</div>
        </div>
    </div>

</div>

<div id="editStudentModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="editStudentTitle">
    <div class="modal" style="max-width:460px;">
        <div class="modal-tag">EDIT STUDENT</div>
        <h2 id="editStudentTitle">Edit Student</h2>
        <div class="form-group"><label for="editStudentName">Full Name <span style="color:var(--red);">*</span></label><input id="editStudentName" class="input" placeholder="e.g. Jane Smith" /></div>
        <div class="form-group"><label for="editStudentSchoolId">School ID <span style="color:var(--red);">*</span></label><input id="editStudentSchoolId" class="input" placeholder="e.g. 8895572" /></div>
        <div class="form-group">
            <label for="editStudentCardId">Card ID <span style="color:var(--text3);font-size:0.75em;font-weight:400;">(optional — can be assigned later)</span></label>
            <input id="editStudentCardId" class="input" placeholder="Scan card or leave blank" />
        </div>
        <div id="editStudentError" role="alert" style="color:var(--red);font-size:0.82rem;font-family:var(--font-mono);min-height:1.2em;"></div>
        <div class="modal-actions" style="flex-direction:row;gap:0.5rem;margin-top:0.25rem;">
            <button id="saveStudentBtn" class="btn primary" style="flex:1;" type="button">Save Changes</button>
            <button id="cancelStudentBtn" class="btn ghost" type="button">Cancel</button>
        </div>
    </div>
</div>

<script type="module" src="studentDashboard.js"></script>
</body>
</html>
